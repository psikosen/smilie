[package]
name = "smilie"
version = "0.1.0"
description = "Scientific paper → interactive learning pages"
authors = ["Raymond Gonzalez"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "smilie_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
thiserror = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
futures = "0.3"

sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "macros", "migrate", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }

image = "0.25"

# Validation
regex = "1"

# Real GGUF inference (optional — heavy compile via cmake).
# Enable with `cargo build --features llama-real`.
llama-cpp-2 = { version = "0.1", optional = true }

# ── Desktop-only deps ────────────────────────────────────────────
# pdfium-render dlopens libpdfium at runtime — fine on macOS / Win /
# Linux, fundamentally incompatible with iOS app sandbox. Mobile uses
# platform-native renderers (PDFKit / PdfRenderer) wired via Swift /
# Kotlin shims (TODO).
[target.'cfg(any(target_os = "macos", target_os = "windows", target_os = "linux"))'.dependencies]
pdfium-render = { version = "0.8", features = ["thread_safe"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
# Shell is only used to spawn the python sidecar on desktop; the mobile
# build doesn't run python at all (everything routes through llama.cpp
# bindings).
tauri-plugin-shell = "2"

# ── Mobile-only deps ─────────────────────────────────────────────
[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
tauri-plugin-deep-link = "2"

[features]
default = []
llama-real = ["dep:llama-cpp-2"]

# Integration tests need:
#   - `tauri/test` for the `MockRuntime` so we can drive the orchestrator
#     without spinning up a real Wry event loop.
#   - `tempfile` for an isolated app_data dir per test run, so we don't
#     touch the user's real Application Support folder.
[dev-dependencies]
tauri = { version = "2", features = ["test"] }
tempfile = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
