name: CI

# Single-job CI for Smilie. Runs on every push and every PR. macOS-only
# for now because mlx-vlm (the macOS-only OCR sidecar) anchors our
# native dev loop; cargo and the SvelteKit static build all work fine
# on macos-latest. Add a matrix later if/when we need Win/Linux
# coverage for the llama.cpp path.
#
# Note on lint scope: the JS/TS lint step (`npm run lint`) currently
# runs `@eslint/js` + `typescript-eslint` recommended only. Svelte
# file linting via `eslint-plugin-svelte` is a follow-up — `svelte-check`
# already handles type errors in `.svelte` so the gap is small.
#
# Note on libpdfium: we deliberately do NOT install the pdfium dylib
# in CI. `cargo clippy` and `cargo test --lib` only compile/link the
# Rust code; the dylib is dlopen'd at runtime, which we never reach
# here. If a future test starts actually rendering a PDF it'll need
# `scripts/install_pdfium.sh` plumbed in.

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-check:
    name: build & check (macos)
    runs-on: macos-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: src-tauri/python/requirements-test.txt

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - name: Install Python test dependencies
        run: python -m pip install -r src-tauri/python/requirements-test.txt

      - name: Lint (eslint)
        run: npm run lint

      - name: Type & Svelte check
        run: npm run check

      - name: Frontend tests (vitest)
        run: npm test

      - name: SvelteKit static build
        run: npm run build

      - name: Cargo fmt check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo tests
        working-directory: src-tauri
        run: cargo test

      - name: Python sidecar tests
        working-directory: src-tauri/python
        run: python -m pytest -q
